<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MDES — Motion Design Engineering System · QA Playground</title>
  <link rel="stylesheet" href="../core/mdes-base.css" />
  <link rel="stylesheet" href="./spinner/animation.css" />
  <link rel="stylesheet" href="./book-opening/animation.css" />
  <link rel="stylesheet" href="./document-processing/animation.css" />
  <link rel="stylesheet" href="./vehicle-movement/animation.css" />
  <link rel="stylesheet" href="./data-synchronization/animation.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #f8fafc; color: #0f172a; padding: 24px; transition: background 0.2s, color 0.2s;
    }
    body[data-page-theme="dark"] { background: #0b1120; color: #e2e8f0; }
    header { max-width: 1120px; margin: 0 auto 20px; }
    h1 { margin: 0 0 6px; font-size: 1.4rem; }
    p.sub { margin: 0; opacity: 0.75; font-size: 0.92rem; }
    .toolbar {
      max-width: 1120px; margin: 0 auto 24px; padding: 14px 16px;
      background: rgba(148, 163, 184, 0.14); border-radius: 12px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    .toolbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; }
    .toolbar button, .toolbar select {
      padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(100,116,139,0.4);
      background: #fff; color: #0f172a; cursor: pointer; font-size: 0.85rem;
    }
    .grid {
      max-width: 1120px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px;
    }
    .card {
      background: #fff; border: 1px solid rgba(148,163,184,0.28); border-radius: 14px;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    body[data-page-theme="dark"] .card { background: #111c33; }
    .card-head { display: flex; justify-content: space-between; align-items: center; }
    .badge { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #dbeafe; color: #1e40af; }
    .stage {
      min-height: 190px; display: flex; align-items: center; justify-content: center;
      border-radius: 10px; background: rgba(148,163,184,0.08); padding: 12px;
    }
    .meta { font-size: 0.78rem; opacity: 0.75; }
  </style>
</head>
<body>
  <header>
    <h1>MDES — QA Playground (M1 &amp; M2)</h1>
    <p class="sub">Núcleo SVG + CSS + MotionController sin dependencias. Prueba reproducción, velocidad, colores, temas, estados, progreso y movimiento reducido.</p>
  </header>

  <section class="toolbar" aria-label="Controles globales">
    <button id="btn-play">▶ Play</button>
    <button id="btn-pause">⏸ Pause</button>
    <button id="btn-restart">↻ Restart</button>
    <label>Velocidad <input id="rng-speed" type="range" min="0.25" max="2.5" step="0.25" value="1" /> <span id="lbl-speed">1x</span></label>
    <label>Estado
      <select id="sel-state">
        <option value="processing" selected>processing</option>
        <option value="idle">idle</option>
        <option value="success">success</option>
        <option value="error">error</option>
      </select>
    </label>
    <label>Tema
      <select id="sel-theme">
        <option value="light" selected>light</option>
        <option value="dark">dark</option>
        <option value="brand">brand</option>
      </select>
    </label>
    <label>Primario <input id="col-primary" type="color" value="#2563eb" /></label>
    <label>Acento <input id="col-accent" type="color" value="#10b981" /></label>
    <label>Progreso Doc <input id="rng-progress" type="range" min="-1" max="100" value="-1" /> <span id="lbl-progress">auto</span></label>
    <label>Reduced Motion
      <select id="sel-reduced">
        <option value="auto" selected>sistema</option>
        <option value="static">static (forzado)</option>
        <option value="minimal">minimal (forzado)</option>
      </select>
    </label>
  </section>

  <main class="grid" id="grid"></main>

  <script type="module">
    import { mountMotion } from '../core/mdes-core.js';

    const EXAMPLES = [
      { dir: 'spinner', title: 'Spinner Ring', level: 'M1' },
      { dir: 'book-opening', title: 'Book Opening', level: 'M2' },
      { dir: 'document-processing', title: 'Document Processing', level: 'M2' },
      { dir: 'vehicle-movement', title: 'Delivery Vehicle', level: 'M2' },
      { dir: 'data-synchronization', title: 'Cloud Data Sync', level: 'M2' },
    ];

    const grid = document.getElementById('grid');
    const controllers = [];
    let docCtrl = null;

    for (const ex of EXAMPLES) {
      const [html, config] = await Promise.all([
        fetch(`./${ex.dir}/animation.html`).then((r) => r.text()),
        fetch(`./${ex.dir}/mdes.config.json`).then((r) => r.json()),
      ]);
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head"><strong>${ex.title}</strong><span class="badge">${ex.level} · ${config.renderer}</span></div>
        <div class="stage">${html}</div>
        <div class="meta">${config.description}</div>
      `;
      grid.appendChild(card);
      const ctrl = await mountMotion(card.querySelector('.mdes'), config);
      controllers.push(ctrl);
      if (ex.dir === 'document-processing') docCtrl = ctrl;
    }

    const each = (fn) => controllers.forEach(fn);
    document.getElementById('btn-play').onclick = () => each((c) => c.play());
    document.getElementById('btn-pause').onclick = () => each((c) => c.pause());
    document.getElementById('btn-restart').onclick = () => each((c) => c.restart());

    const rngSpeed = document.getElementById('rng-speed');
    rngSpeed.oninput = () => {
      const s = Number(rngSpeed.value);
      document.getElementById('lbl-speed').textContent = `${s}x`;
      each((c) => c.setSpeed(s));
    };

    document.getElementById('sel-state').onchange = (e) => each((c) => c.setState(e.target.value));
    document.getElementById('sel-theme').onchange = (e) => {
      const t = e.target.value;
      document.body.dataset.pageTheme = t;
      each((c) => { c.resetColors(); c.setTheme(t); });
    };
    document.getElementById('col-primary').oninput = (e) => each((c) => c.setColors({ primaryColor: e.target.value }));
    document.getElementById('col-accent').oninput = (e) => each((c) => c.setColors({ accentColor: e.target.value }));

    const rngProgress = document.getElementById('rng-progress');
    rngProgress.oninput = () => {
      const v = Number(rngProgress.value);
      document.getElementById('lbl-progress').textContent = v < 0 ? 'auto' : `${v}%`;
      docCtrl?.setProgress(v < 0 ? null : v / 100);
    };

    document.getElementById('sel-reduced').onchange = (e) => {
      const mode = e.target.value;
      each((c) => {
        if (mode === 'auto') delete c.root.dataset.motionReduced;
        else c.root.dataset.motionReduced = mode;
      });
    };
  </script>
</body>
</html>
